name: Build LineageOS 20.0

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Lunch product name (matches lineage_<product>.mk)"
        required: true
        default: "8492A"
        type: string
      device:
        description: "Device codename / PRODUCT_DEVICE (matches device/tcl/<device>)"
        required: true
        default: "Freyr_10_1_WiFi"
        type: string
      build_type:
        description: "Build variant"
        required: true
        default: "userdebug"
        type: choice
        options:
          - userdebug
          - eng
          - user
      target:
        description: "Make target"
        required: true
        default: "bootimage"
        type: choice
        options:
          - bootimage
          - vendorimage
          - productimage
          - systemextimage
          - systemimage
          - systemimage vendorimage productimage systemextimage bootimage
          - bacon
      resume_from_checkpoint:
        description: "Resume from a previous timeout checkpoint GitHub Release"
        required: true
        default: false
        type: boolean

concurrency:
  group: build-lineage-${{ inputs.device }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

env:
  MANIFEST_URL: "https://github.com/LineageOS/android.git"
  MANIFEST_BRANCH: "lineage-20.0"
  OUT_DIR: "/home/runner/out"
  USE_CCACHE: "0"
  WITH_TIDY: "false"
  ALLOW_LOCAL_TIDY_TRUE: "false"
  SKIP_ABI_CHECKS: "true"
  WITH_DEXPREOPT: "false"
  WITH_DEXPREOPT_DEBUG_INFO: "false"
  PRODUCT_MINIMIZE_JAVA_DEBUG_INFO: "true"
  ART_BUILD_TARGET_DEBUG: "false"
  ART_BUILD_HOST_DEBUG: "false"
  GOGC: "50"
  GOMEMLIMIT: "9GiB"
  _JAVA_OPTIONS: "-Xmx4g"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: write
    env:
      STORAGE_REPO: ${{ secrets.STORAGE_REPO || github.repository }}
      GH_TOKEN: ${{ secrets.STORAGE_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Purge Unused Ubuntu Packages & Configure Hybrid ZRAM + Swap
        run: |
          set -e
          sudo systemctl stop systemd-oomd docker docker.socket containerd snapd || true

          # Protect GitHub Actions runner processes from Linux OOM killer
          for pid in $(pgrep -f "Runner\."); do
            echo -1000 | sudo tee "/proc/$pid/oom_score_adj" >/dev/null || true
          done

          # Configure ZRAM (high priority) + dynamic /mnt/swapfile sized to leave room for out/host
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile

          sudo modprobe zram 2>/dev/null || true
          if [ ! -b /dev/zram0 ] && [ -e /sys/class/zram-control/hot_add ]; then
            sudo cat /sys/class/zram-control/hot_add >/
            
