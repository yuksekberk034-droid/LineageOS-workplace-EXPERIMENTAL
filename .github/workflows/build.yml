name: Build LineageOS 20.0

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device codename"
        required: true
        default: "Freyr_10_1_WiFi"
        type: string
      build_type:
        description: "Build variant"
        required: true
        default: "userdebug"
        type: choice
        options:
          - userdebug
          - eng
          - user
      target:
        description: "Make target (use partition images for bringup, bacon for full zip)"
        required: true
        default: "systemimage vendorimage bootimage"
        type: choice
        options:
          - systemimage vendorimage bootimage
          - bacon
      resume_from_remote:
        description: "Resume from a previous timeout checkpoint on remote server"
        required: true
        default: false
        type: boolean

env:
  MANIFEST_URL: "https://github.com/LineageOS/android.git"
  MANIFEST_BRANCH: "lineage-20.0"
  OUT_DIR: "/mnt/out"
  USE_CCACHE: "0"
  WITH_TIDY: "false"
  SKIP_ABI_CHECKS: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Free Disk Space & Configure ZRAM + /mnt/out
        run: |
          set -e
          # Reclaim ~30-35 GB on / by removing preinstalled SDKs/runtimes
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost

          # Disable disk swap on /mnt so the full ~75 GB local NVMe is free for out/
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile

          # Enable 12 GB compressed in-memory ZRAM swap (eliminates disk swap thrashing)
          sudo modprobe zram
          sudo zramctl /dev/zram0 --algorithm zstd --size 12G
          sudo mkswap /dev/zram0
          sudo swapon -p 100 /dev/zram0

          # Prepare /mnt/out on local runner SSD
          sudo mkdir -p /mnt/out
          sudo chown -R "$USER:$USER" /mnt/out

          df -h / /mnt
          free -h

      - name: Install Build Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential curl flex g++-multilib gcc-multilib git \
            git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses6 libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python-is-python3 zstd

          # Compatibility symlink for legacy AOSP prebuilts on Ubuntu 24.04
          if [ ! -e /usr/lib/x86_64-linux-gnu/libncurses.so.5 ] && [ -e /usr/lib/x86_64-linux-gnu/libncurses.so.6 ]; then
            sudo ln -s /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
            sudo ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          fi

          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Connect Tailscale (Optional)
        if: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup Remote SSH Access (Optional)
        if: ${{ secrets.REMOTE_SSH_KEY != '' && secrets.REMOTE_HOST != '' }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.REMOTE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          REMOTE_PORT="${{ secrets.REMOTE_PORT || '8022' }}"
          ssh-keyscan -p "$REMOTE_PORT" -H "${{ secrets.REMOTE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync LineageOS Source & Local Manifests
        run: |
          set -e
          mkdir -p ~/android
          cd ~/android

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

          # --depth=1 keeps total source + .repo footprint around ~60 GB instead of ~100 GB
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1 --git-lfs

          # Clone your device/vendor/kernel local_manifests if configured
          if [ -n "${{ secrets.LOCAL_MANIFEST_URL }}" ]; then
            mkdir -p .repo/local_manifests
            git clone --depth=1 \
              -b "${{ secrets.LOCAL_MANIFEST_BRANCH || 'lineage-20.0' }}" \
              "${{ secrets.LOCAL_MANIFEST_URL }}" \
              .repo/local_manifests
          fi

          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j"$(nproc)"
          df -h / /mnt

      - name: Restore Build Checkpoint from Remote Server
        if: ${{ inputs.resume_from_remote && secrets.REMOTE_HOST != '' }}
        run: |
          set -e
          REMOTE_PORT="${{ secrets.REMOTE_PORT || '8022' }}"
          REMOTE_DEST="${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}"
          REMOTE_DIR="${{ secrets.REMOTE_OUT_DIR || '~/lineage_out' }}"

          echo "Streaming checkpoint from ${REMOTE_DEST}:${REMOTE_DIR}/out_checkpoint.tar.zst..."
          ssh -p "$REMOTE_PORT" "$REMOTE_DEST" "cat ${REMOTE_DIR}/out_checkpoint.tar.zst" \
            | zstd -d -T0 \
            | tar -xf - -C /mnt/out

      - name: Build LineageOS (With 4h55m Timeout Checkpointing)
        run: |
          set +e
          cd ~/android
          source build/envsetup.sh
          lunch "lineage_${{ inputs.device }}-${{ inputs.build_type }}"

          # Stop cleanly at 295 minutes (4h55m) so there is ~55m left to stream a checkpoint if needed
          timeout --signal=TERM 295m mka ${{ inputs.target }} -j"$(nproc)"
          BUILD_EXIT=$?
          set -e

          if [ "$BUILD_EXIT" -eq 0 ]; then
            echo "Build completed successfully!"
            exit 0
          elif [ "$BUILD_EXIT" -eq 124 ] || [ "$BUILD_EXIT" -eq 143 ]; then
            echo "Build reached 4h55m safety limit. Streaming /mnt/out checkpoint to remote server..."
            if [ -n "${{ secrets.REMOTE_HOST }}" ]; then
              REMOTE_PORT="${{ secrets.REMOTE_PORT || '8022' }}"
              REMOTE_DEST="${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}"
              REMOTE_DIR="${{ secrets.REMOTE_OUT_DIR || '~/lineage_out' }}"
              ssh -p "$REMOTE_PORT" "$REMOTE_DEST" "mkdir -p ${REMOTE_DIR}"
              tar -cf - -C /mnt/out . \
                | zstd -3 -T0 \
                | ssh -p "$REMOTE_PORT" "$REMOTE_DEST" "cat > ${REMOTE_DIR}/out_checkpoint.tar.zst"
              echo "Checkpoint saved. Re-run this workflow with resume_from_remote=true to finish."
            fi
            exit 1
          else
            echo "Build failed with exit code $BUILD_EXIT"
            exit "$BUILD_EXIT"
          fi

      - name: Upload Finished Artifacts to Remote Server
        if: ${{ success() && secrets.REMOTE_HOST != '' }}
        run: |
          set -e
          REMOTE_PORT="${{ secrets.REMOTE_PORT || '8022' }}"
          REMOTE_DEST="${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}"
          REMOTE_DIR="${{ secrets.REMOTE_OUT_DIR || '~/lineage_out' }}/releases/${{ inputs.device }}-$(date +%Y%m%d-%H%M)"
          PRODUCT_OUT="/mnt/out/target/product/${{ inputs.device }}"

          ssh -p "$REMOTE_PORT" "$REMOTE_DEST" "mkdir -p ${REMOTE_DIR}"
          for f in "$PRODUCT_OUT"/lineage-*.zip "$PRODUCT_OUT"/*.img; do
            [ -f "$f" ] && scp -P "$REMOTE_PORT" "$f" "${REMOTE_DEST}:${REMOTE_DIR}/"
          done

      - name: Upload GitHub Release Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-20-${{ inputs.device }}
          if-no-files-found: warn
          path: |
            /mnt/out/target/product/${{ inputs.device }}/lineage-*.zip
            /mnt/out/target/product/${{ inputs.device }}/boot.img
            /mnt/out/target/product/${{ inputs.device }}/system.img
            /mnt/out/target/product/${{ inputs.device }}/vendor.img
            /mnt/out/target/product/${{ inputs.device }}/recovery.img
