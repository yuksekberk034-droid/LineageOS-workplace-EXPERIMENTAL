name: Build LineageOS for TCL 8492A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Swap Space (16GB)
        run: |
          # Remove default swap from /mnt to free up the full 14GB secondary drive
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          df -h /
          
          # Create an 16GB swap on the main root drive
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          
          git config --global user.name "GitHub Action Builder"
          git config --global user.email "actions@github.com"
          
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          
      - name: Inject Legacy libncurses5 for Ubuntu 24.04
        run: |
          cd /tmp
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb
          sudo dpkg -i libtinfo5_6.3-2_amd64.deb libncurses5_6.3-2_amd64.deb
          df -h /

      - name: Initialize LineageOS Workspace
        run: |
          mkdir workspace
          cd workspace
          ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --depth=1 --no-clone-bundle
          
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/.github/manifests/8492A.xml .repo/local_manifests/

      - name: Sync Source Code
        run: |
          cd workspace
          ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          
          echo "=== Available Space Before Compilation ==="
          df -h /

      
      
          - name: Free Space (Nuclear Nuke)
          run: |
          cd workspace
          echo "=== Nuking .repo Database BEFORE Deduplication ==="
          # Free up the ~15GB Git history so 'mka nothing' has room to breathe
          rm -rf .repo
          
          # Trick the packaging script so the build doesn't crash at 99%
          mkdir -p .repo/repo
          cat << 'EOF' > .repo/repo/repo
          import sys
          print('<?xml version="1.0" encoding="UTF-8"?>\n<manifest></manifest>')
          EOF
          chmod +x .repo/repo/repo
          
          df -h /

      - name: Auto-Deduplicate Vendor Tree
        run: |
          cd workspace
          
          cat << 'EOF' > auto_dedup.py
          import os, subprocess, re, sys

          SEARCH_DIRS = ["vendor/tcl", "device/tcl"]

          def strip_bp(module):
              for search_dir in SEARCH_DIRS:
                  if not os.path.exists(search_dir): continue
                  for root, _, files in os.walk(search_dir):
                      if "Android.bp" in files:
                          filepath = os.path.join(root, "Android.bp")
                          with open(filepath, 'r') as f: data = f.read()
                          
                          match = re.search(r'name:\s*"' + re.escape(module) + r'"', data)
                          if match:
                              idx = data.rfind('{', 0, match.start())
                              start = data.rfind('\n', 0, idx)
                              if start == -1: start = 0
                              
                              braces = 0
                              in_block = False
                              for i in range(idx, len(data)):
                                  if data[i] == '{': braces += 1; in_block = True
                                  elif data[i] == '}':
                                      braces -= 1
                                      if in_block and braces == 0:
                                          with open(filepath, 'w') as f:
                                              f.write(data[:start] + data[i+1:])
                                          return True
              return False

          def strip_mk(module):
              for search_dir in SEARCH_DIRS:
                  if not os.path.exists(search_dir): continue
                  for root, _, files in os.walk(search_dir):
                      if "Android.mk" in files:
                          filepath = os.path.join(root, "Android.mk")
                          with open(filepath, 'r') as f: data = f.read()
                          
                          match = re.search(r'LOCAL_MODULE\s*:=\s*' + re.escape(module) + r'\b', data)
                          if match:
                              start = data.rfind('include $(CLEAR_VARS)', 0, match.start())
                              if start == -1: return False
                              end = data.find('include $(BUILD_PREBUILT)', match.end())
                              if end == -1: return False
                              end += len('include $(BUILD_PREBUILT)')
                              
                              with open(filepath, 'w') as f:
                                  f.write(data[:start] + data[end:])
                              return True
              return False

          print("Starting automated duplicate removal loop...")
          while True:
              # Inject hiddenapi bypasses directly into the parsing command
              cmd = "export DISABLE_HIDDENAPI_CHECKS=true && export IGNORE_HIDDENAPI_CHECK=true && source build/envsetup.sh && lunch lineage_8492A-userdebug && mka nothing"
              process = subprocess.Popen(cmd, shell=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, executable='/bin/bash')
              output, _ = process.communicate()
              output = output.decode('utf-8')
              
              if process.returncode == 0:
                  print("\nSUCCESS: Makefiles parsed cleanly! No duplicates remaining.")
                  os.system("rm -rf out/")
                  break
                  
              match = re.search(r'MODULE\.[A-Z_]+\.[A-Z_]+\.([^ ]+) already defined', output)
              if match:
                  module = match.group(1)
                  if strip_bp(module) or strip_mk(module):
                      print(f"Deleted conflicting prebuilt: {module}")
                      # Purge the out/ cache instantly to keep disk space free
                      os.system("rm -rf out/")
                  else:
                      print(f"\nERROR: Could not find {module} in vendor or device tree.")
                      sys.exit(1)
              else:
                  print("\nMake failed for a non-duplicate reason:")
                  print(output[-2000:])
                  sys.exit(1)
          EOF
          
          python3 auto_dedup.py

      - name: Compile LineageOS
        run: |
          cd workspace
          
          export TMPDIR="$PWD/tmp"
          mkdir -p "$TMPDIR"
          export USE_CCACHE=0
          export _JAVA_OPTIONS="-Xmx8g"
          
          export DISABLE_HIDDENAPI_CHECKS=true
          export IGNORE_HIDDENAPI_CHECK=true
          
          source build/envsetup.sh
          lunch lineage_8492A-userdebug
          
          echo "=== Space Before Final Build ==="
          df -h /
          
          mka bacon -j$(nproc --all)

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-8492A-Build
          path: workspace/out/target/product/8492A/lineage-*.zip
