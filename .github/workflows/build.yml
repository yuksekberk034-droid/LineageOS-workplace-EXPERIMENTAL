name: Build LineageOS for TCL 8492A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Swap Space (12GB on /mnt)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h / /mnt

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          
          git config --global user.name "GitHub Action Builder"
          git config --global user.email "actions@github.com"
          
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          
      - name: Inject Legacy libncurses5 for Ubuntu 24.04
        run: |
          cd /tmp
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb
          sudo dpkg -i libtinfo5_6.3-2_amd64.deb libncurses5_6.3-2_amd64.deb
          df -h /

      - name: Initialize LineageOS Workspace
        run: |
          mkdir workspace
          cd workspace
          ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --depth=1 --no-clone-bundle
          
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/.github/manifests/8492A.xml .repo/local_manifests/

      - name: Sync Source Code
        run: |
          cd workspace
          ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          
          echo "=== Available Space Before Compilation ==="
          df -h /
          
      - name: Compile LineageOS
        run: |
          cd workspace
          export TMPDIR="/mnt/tmp"
          sudo mkdir -p "$TMPDIR" && sudo chown -R $USER:$USER "$TMPDIR"
          export USE_CCACHE=0
          export WITH_DEXPREOPT=false
          export _JAVA_OPTIONS="-Xmx8g"
          
          source build/envsetup.sh
          lunch lineage_8492A-userdebug
          
          echo "=== Space BEFORE Nuke ==="
          df -h /
          
          rm -rf .repo prebuilts/*/darwin-x86 prebuilts/*/*/darwin-x86 prebuilts/*/windows-x86 prebuilts/*/*/windows-x86
          find prebuilts cts -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
          
          mkdir -p .repo/repo
          cat << 'EOF' > .repo/repo/repo
          import sys
          print('<?xml version="1.0" encoding="UTF-8"?>\n<manifest></manifest>')
          EOF
          chmod +x .repo/repo/repo
          
          echo "=== Space AFTER Nuke ==="
          df -h / /mnt
          
          # Log full output to build.log and print a 60s status + free-space heartbeat so GitHub never truncates errors
          mka bacon -j$(nproc --all) > build.log 2>&1 &
          BUILD_PID=$!

          while kill -0 $BUILD_PID 2>/dev/null; do
            sleep 60
            PROGRESS=$(grep -E '^\[ *[0-9]+%' build.log | tail -n 1)
            DISK_FREE=$(df -h / | awk 'NR==2 {print $4}')
            echo "[$(date -u +%H:%M:%S)] ${PROGRESS:-Starting...} | Root free: ${DISK_FREE}"
          done

          if ! wait $BUILD_PID; then
            echo "=== BUILD FAILED — LAST 100 LINES OF build.log ==="
            tail -n 100 build.log
            exit 1
          fi
          df -h /
          
      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-8492A-Build
          path: workspace/out/target/product/*/lineage-*.zip
