name: Build LineageOS for TCL 8492A

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          
          # Git configuration required by 'repo'
          git config --global user.name "GitHub Action Builder"
          git config --global user.email "actions@github.com"
          
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo


      - name: Initialize LineageOS Workspace
        run: |
              mkdir workspace
              cd workspace
              ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --depth=1
              
              mkdir -p .repo/local_manifests
              cp ../.github/manifests/8492A.xml .repo/local_manifests/
              
              # Copy the local manifest
              mkdir -p .repo/local_manifests
              cp ../.github/manifests/8492A.xml .repo/local_manifests/

      - name: Sync Source Code (Shallow)
        run: |
          cd workspace
          # Highly optimized sync for CI environments
          ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Set Up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "10G"

      - name: Compile LineageOS
        run: |
          cd workspace
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 10G
          
          source build/envsetup.sh
          # Ensure this matches your device tree's makefile name
          lunch lineage_8492A-userdebug
          
          # Build the flashable zip
          mka bacon -j$(nproc --all)

      # Update Upload Artifact to v4
      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-8492A-Build
          path: workspace/out/target/product/8492A/lineage-*.zip
