name: Build LineageOS for TCL 8492A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Swap Space (12GB)
        run: |
          # Remove default swap from /mnt to free up the full 14GB secondary drive
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          df -h /
          
          # Create an 8GB swap on the main root drive
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          
          git config --global user.name "GitHub Action Builder"
          git config --global user.email "actions@github.com"
          
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          
      - name: Inject Legacy libncurses5 for Ubuntu 24.04
        run: |
          cd /tmp
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb
          sudo dpkg -i libtinfo5_6.3-2_amd64.deb libncurses5_6.3-2_amd64.deb
          df -h /

      - name: Initialize LineageOS Workspace
        run: |
          mkdir workspace
          cd workspace
          ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --depth=1 --no-clone-bundle
          
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/.github/manifests/8492A.xml .repo/local_manifests/

      - name: Sync Source Code
        run: |
          cd workspace
          ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          
          echo "=== Available Space Before Compilation ==="
          df -h /

          - name: Strip duplicate AOSP modules from vendor tree
           run: |
          python3 -c '
          import os, re

          bp_path = "vendor/tcl/Freyr_10_1_WiFi/Android.bp"
          mk_path = "vendor/tcl/Freyr_10_1_WiFi/Freyr_10_1_WiFi-vendor.mk"

          with open(bp_path) as f:
              bp = f.read()

          vendor_mods = set(re.findall(r"name:\s*\"([^\"]+)\"", bp))

          # Scan all Android.bp files outside vendor/tcl
          aosp_mods = set()
          for root, dirs, files in os.walk("."):
              if root.startswith("./out") or root.startswith("./vendor/tcl") or "/.git" in root:
                  continue
              if "Android.bp" in files:
                  with open(os.path.join(root, "Android.bp"), errors="ignore") as f:
                      aosp_mods.update(re.findall(r"name:\s*\"([^\"]+)\"", f.read()))

          dups = sorted(vendor_mods & aosp_mods)
          print(f"Found {len(dups)} duplicate modules:", dups)

          for mod in dups:
              bp = re.sub(r"\n\w+\s*\{\s*name:\s*\"" + re.escape(mod) + r"\"[\s\S]*?\n\}", "", bp)

          with open(bp_path, "w") as f:
              f.write(bp)

          with open(mk_path) as f:
              mk_lines = f.readlines()

          with open(mk_path, "w") as f:
              for line in mk_lines:
                  if not any(re.search(r"\b" + re.escape(mod) + r"\b", line) for mod in dups):
                      f.write(line)
          '

          
      - name: Compile LineageOS
        run: |
          cd workspace
          export TMPDIR="$PWD/tmp"
          mkdir -p "$TMPDIR"
          export USE_CCACHE=0
          export _JAVA_OPTIONS="-Xmx8g"
          
          source build/envsetup.sh
          lunch lineage_Freyr_10_1_WiFi-userdebug
          
          echo "=== Space BEFORE Nuke ==="
          df -h /
          
          rm -rf .repo
          
          mkdir -p .repo/repo
          cat << 'EOF' > .repo/repo/repo
          import sys
          print('<?xml version="1.0" encoding="UTF-8"?>\n<manifest></manifest>')
          EOF
          chmod +x .repo/repo/repo
          
          echo "=== Space AFTER Nuke ==="
          df -h /
          
          # Proceed with the build using all cores
          mka bacon -j$(nproc --all)
          df -h /

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-8492A-Build
          path: workspace/out/target/product/Freyr_10_1_WiFi/lineage-*.zip
