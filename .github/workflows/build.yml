name: Build LineageOS for TCL Tab 10L Gen 2

on:
  workflow_dispatch:
    inputs:
      lineage_branch:
        description: LineageOS branch to sync
        required: true
        default: lineage-20.0
        type: string
      jobs:
        description: Number of parallel build jobs (Default 2 for runner safety)
        required: true
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build LineageOS
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out builder repository
        uses: actions/checkout@v4

      # MUST BE FIRST: Maximizes disk space (~84GB) and sets up 12GB Swap natively
      - name: Maximize Runner Space & Add Swap
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          temp-reserve-mb: 100
          swap-size-mb: 12288
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 \
            openjdk-17-jdk -y

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize LineageOS source tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"
          repo init -u https://github.com/LineageOS/android.git -b "${{ inputs.lineage_branch }}" --git-lfs --depth=1

          # Copy local manifest if present in repo
          if [ -f "$GITHUB_WORKSPACE/.github/manifests/8492A.xml" ]; then
            mkdir -p .repo/local_manifests
            cp "$GITHUB_WORKSPACE/.github/manifests/8492A.xml" .repo/local_manifests/
          fi

      - name: Sync LineageOS source
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/android"
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

      - name: Clone Device and Vendor Repositories (Fallback)
        shell: bash
        run: |
          set -euxo pipefail
          # Ensure Device Tree is present
          if [ ! -d "$GITHUB_WORKSPACE/android/device/tcl/8492A" ]; then
            git clone https://github.com/yuksekberk034-droid/android_device_tcl_8492A.git -b main "$GITHUB_WORKSPACE/android/device/tcl/8492A"
          fi

          # Ensure Vendor Tree is present
          if [ ! -d "$GITHUB_WORKSPACE/android/vendor/tcl/8492A" ]; then
            git clone https://github.com/yuksekberk034-droid/android_vendor_tcl_8492A.git -b main "$GITHUB_WORKSPACE/android/vendor/tcl/8492A"
          fi

      - name: Build LineageOS
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/android"
          
          # Set temporary build files inside workspace
          export TMPDIR="$PWD/tmp"
          mkdir -p "$TMPDIR"

          # Disable ccache for first run to protect disk space
          export USE_CCACHE=0
          
          # Cap Java heap to 4GB to prevent OOM thrashing on 7GB RAM runner
          export _JAVA_OPTIONS="-Xmx4g"
          
          source build/envsetup.sh
          lunch lineage_8492A-userdebug
          
          mka bacon -j"${{ inputs.jobs }}"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-8492A-${{ inputs.lineage_branch }}
          path: |
            ${{ github.workspace }}/android/out/target/product/8492A/lineage-*.zip
            ${{ github.workspace }}/android/out/target/product/8492A/boot.img
          if-no-files-found: warn
          retention-days: 7
