name: Build LineageOS 20.0

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Lunch product name (matches lineage_<product>.mk)"
        required: true
        default: "8492A"
        type: string
      device:
        description: "Device codename / PRODUCT_DEVICE (matches device/tcl/<device>)"
        required: true
        default: "Freyr_10_1_WiFi"
        type: string
      build_type:
        description: "Build variant"
        required: true
        default: "userdebug"
        type: choice
        options:
          - userdebug
          - eng
          - user
      target:
        description: "Make target (use partition images for bringup, bacon for full zip)"
        required: true
        default: "systemimage vendorimage bootimage"
        type: choice
        options:
          - systemimage vendorimage bootimage
          - bacon
      resume_from_remote:
        description: "Resume from a previous timeout checkpoint on remote server"
        required: true
        default: false
        type: boolean

env:
  MANIFEST_URL: "https://github.com/LineageOS/android.git"
  MANIFEST_BRANCH: "lineage-20.0"
  OUT_DIR: "/home/runner/out"
  USE_CCACHE: "0"
  WITH_TIDY: "false"
  ALLOW_LOCAL_TIDY_TRUE: "false"
  SKIP_ABI_CHECKS: "true"
  WITH_DEXPREOPT_DEBUG_INFO: "false"
  ART_BUILD_TARGET_DEBUG: "false"
  ART_BUILD_HOST_DEBUG: "false"
  GOGC: "40"
  _JAVA_OPTIONS: "-Xmx6g"
  REMOTE_PORT: "8022"
  REMOTE_OUT_DIR: "lineage_out"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_SSH_KEY: ${{ secrets.REMOTE_SSH_KEY }}

    steps:
      - name: Purge Unused Ubuntu Packages & Configure ZRAM + Storage
        run: |
          set -e
          sudo systemctl stop systemd-oomd docker docker.socket containerd snapd || true

          # Configure 12 GB ZRAM (no disk swapfile on /mnt so /mnt keeps ~10.5 GB free)
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo modprobe zram
          sudo zramctl /dev/zram0 --algorithm zstd --size 12G
          sudo mkswap /dev/zram0
          sudo swapon -p 100 /dev/zram0

          # Purge heavy pre-installed Ubuntu packages not needed for AOSP/LineageOS (~25 GB freed)
          sudo DEBIAN_FRONTEND=noninteractive apt-get purge -y --allow-remove-essential \
            'temurin-*' 'google-chrome-*' 'microsoft-edge-*' 'firefox*' \
            'azure-cli' 'google-cloud-cli' 'powershell' 'dotnet*' 'mono-*' \
            'llvm-*' 'clang-*' 'mysql-*' 'postgresql-*' 'php*' 'ruby*' \
            'snapd' 'apport*' 'man-db' 'fonts-noto*' || true
          sudo apt-get autoremove -y --purge || true
          sudo apt-get clean

          sudo rm -rf \
            /var/lib/docker \
            /var/lib/snapd \
            /var/cache/snapd \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /opt/az \
            /opt/microsoft \
            /opt/google \
            /usr/share/miniconda \
            /usr/share/swift \
            /usr/share/rustup \
            /usr/local/cargo \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg \
            /usr/local/lib/node_modules \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /usr/local/julia* \
            /usr/share/doc/* \
            /usr/share/man/*

          # Keep ONLY fixed-size out/host (~3.5 GB) on /mnt; keep growing target/common on /
          mkdir -p /home/runner/out/soong /home/runner/out/target/common
          sudo mkdir -p /mnt/out_ext/host
          sudo chown -R "$USER:$USER" /mnt/out_ext
          ln -sfn /mnt/out_ext/host /home/runner/out/host

          df -h / /mnt
          free -h

      - name: Install Minimal Build Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf lib32ncurses-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses6 libncurses-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop openssh-client pngcrush rsync schedtool \
            squashfs-tools unzip xsltproc zip zlib1g-dev python-is-python3 zstd sshfs
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          if [ ! -e /usr/lib/x86_64-linux-gnu/libncurses.so.5 ] && [ -e /usr/lib/x86_64-linux-gnu/libncurses.so.6 ]; then
            sudo ln -s /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
            sudo ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          fi

          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Connect Tailscale
        if: env.TS_AUTHKEY != ''
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ env.TS_AUTHKEY }}

      - name: Setup Remote SSH & Mount Cold-Storage
        if: env.REMOTE_SSH_KEY != '' && env.REMOTE_HOST != ''
        run: |
          set -e
          mkdir -p ~/.ssh /tmp/remote_out
          chmod 700 ~/.ssh

          if printf '%s' "$REMOTE_SSH_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$REMOTE_SSH_KEY" | tr -d '\r' > ~/.ssh/id_remote
          else
            printf '%s' "$REMOTE_SSH_KEY" | tr -d ' \n\r\t' | base64 -d > ~/.ssh/id_remote
          fi
          chmod 600 ~/.ssh/id_remote

          ssh-keygen -y -f ~/.ssh/id_remote > /dev/null

          cat << 'EOF' > ~/.ssh/config
          Host *
            IdentityFile ~/.ssh/id_remote
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

          sudo chmod 666 /dev/fuse 2>/dev/null || true
          DEST="${REMOTE_USER}@${REMOTE_HOST}"
          ssh -p "$REMOTE_PORT" "$DEST" "mkdir -p ${REMOTE_OUT_DIR}/cold_offload/symbols ${REMOTE_OUT_DIR}/cold_offload/out_offload"
          sshfs -p "$REMOTE_PORT" -o reconnect,ServerAliveInterval=15,ServerAliveCountMax=3,compression=no \
            "${DEST}:${REMOTE_OUT_DIR}/cold_offload" /tmp/remote_out

          mkdir -p "/home/runner/out/target/product/${{ inputs.device }}"
          ln -sfn /tmp/remote_out/symbols "/home/runner/out/target/product/${{ inputs.device }}/symbols"

      - name: Sync LineageOS Source, Clone Trees & Strip .repo/.git
        run: |
          set -e
          mkdir -p ~/android
          cd ~/android

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1 --git-lfs
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j"$(nproc)"

          mkdir -p device/tcl vendor/tcl
          git clone --depth=1 https://github.com/yuksekberk034-droid/LineageOS-workplace-EXPERIMENTAL.git "device/tcl/${{ inputs.device }}"
          git clone --depth=1 https://github.com/yuksekberk034-droid/TCL-8492A-Vendor-tree.git "vendor/tcl/${{ inputs.device }}"

          # Snapshot pinned manifest, then delete .repo and non-kernel .git dirs (~42 GB freed)
          repo manifest -o /tmp/build-manifest-snapshot.xml -r
          rm -rf .repo
          find . -not -path "./kernel/*" -name ".git" -prune -exec rm -rf {} +

          mkdir -p .repo/manifests .repo/repo
          cp /tmp/build-manifest-snapshot.xml .repo/manifest.xml
          printf "#!/usr/bin/env python3\nimport sys\nif \"manifest\" in sys.argv[1:]:\n    sys.stdout.write(open(\"/tmp/build-manifest-snapshot.xml\").read())\n" > .repo/repo/repo
          chmod +x .repo/repo/repo

          df -h / /mnt

      - name: Restore Build Checkpoint from Remote Server
        if: inputs.resume_from_remote && env.REMOTE_HOST != ''
        run: |
          set -e
          DEST="${REMOTE_USER}@${REMOTE_HOST}"

          # Backdate freshly synced source files so Ninja does not rebuild the 81,851 completed targets
          echo "Backdating source tree timestamps to preserve checkpoint mtimes..."
          find ~/android -exec touch -h -t 202001010000 {} +

          echo "Streaming checkpoint from ${DEST}:${REMOTE_OUT_DIR}/out_checkpoint.tar.zst..."
          ssh -p "$REMOTE_PORT" "$DEST" "cat ${REMOTE_OUT_DIR}/out_checkpoint.tar.zst" \
            | zstd -d -T0 \
            | tar -xPf - --overwrite

          # Migrate target/common off /mnt onto / so /mnt cannot fill up during Java compilation
          if [ -L /home/runner/out/target/common ]; then
            rm -f /home/runner/out/target/common
            mkdir -p /home/runner/out/target/common
            if [ -d /mnt/out_ext/common ]; then
              cp -a /mnt/out_ext/common/. /home/runner/out/target/common/
              rm -rf /mnt/out_ext/common
            fi
          fi

          df -h / /mnt

      - name: Build LineageOS (Atomic Cold-Offload + Checkpointing)
        run: |
          set +e
          cd ~/android

          # Proactive atomic cold-offloader: triggers whenever / drops below 22 GB free
          # and offloads idle subtrees across soong/.intermediates, target/common/obj, and product/obj
          (
            OUT_ROOT="/home/runner/out"
            DEVICE_OBJ="$OUT_ROOT/target/product/${{ inputs.device }}/obj"
            while true; do
              sleep 20
              ROOT_FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G",""); print $4}')
              if [ "$ROOT_FREE_GB" -lt 22 ] && mountpoint -q /tmp/remote_out; then
                for base in "$OUT_ROOT/soong/.intermediates" "$OUT_ROOT/target/common/obj" "$DEVICE_OBJ"; do
                  [ -d "$base" ] || continue
                  for grp in "$base"/*; do
                    [ -d "$grp" ] && [ ! -L "$grp" ] || continue
                    for sub in "$grp"/*; do
                      [ -d "$sub" ] && [ ! -L "$sub" ] || continue
                      case "$(basename "$sub")" in
                        clang|llvm) continue ;;
                      esac
                      if [ -z "$(find "$sub" -mmin -6 2>/dev/null | head -n 1)" ]; then
                        REL="${sub#$OUT_ROOT/}"
                        DEST_DIR="/tmp/remote_out/out_offload/$REL"
                        STAGE_DIR="${DEST_DIR}.stage"
                        mkdir -p "$(dirname "$DEST_DIR")"
                        rm -rf "$STAGE_DIR" "$DEST_DIR"
                        if cp -a "$sub" "$STAGE_DIR" 2>/dev/null; then
                          mv "$STAGE_DIR" "$DEST_DIR"
                          mv "$sub" "${sub}.old"
                          ln -s "$DEST_DIR" "$sub"
                          rm -rf "${sub}.old"
                          echo "[Cold-Offload] Moved $REL -> remote (Root free: $(df -BG / | awk 'NR==2 {print $4}'))"
                        else
                          rm -rf "$STAGE_DIR"
                        fi
                        ROOT_FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G",""); print $4}')
                        [ "$ROOT_FREE_GB" -ge 28 ] && break 3
                      fi
                    done
                  done
                done
              fi
            done
          ) &
          OFFLOAD_PID=$!

          timeout --signal=TERM 295m bash -c '
            set -e
            source build/envsetup.sh
            lunch "lineage_${{ inputs.product }}-${{ inputs.build_type }}"

            df -h / /mnt
            free -h
            mka ${{ inputs.target }} -j"$(nproc)"
          '
          BUILD_EXIT=$?
          kill "$OFFLOAD_PID" 2>/dev/null || true
          set -e

          if [ "$BUILD_EXIT" -eq 0 ]; then
            echo "Build completed successfully!"
            exit 0
          elif [ "$BUILD_EXIT" -eq 124 ] || [ "$BUILD_EXIT" -eq 143 ]; then
            echo "Build reached 4h55m safety limit. Streaming checkpoint to remote server..."
            if [ -n "$REMOTE_HOST" ]; then
              DEST="${REMOTE_USER}@${REMOTE_HOST}"
              ssh -p "$REMOTE_PORT" "$DEST" "mkdir -p ${REMOTE_OUT_DIR}"
              tar -cPf - /home/runner/out /mnt/out_ext \
                | zstd -3 -T0 \
                | ssh -p "$REMOTE_PORT" "$DEST" "cat > ${REMOTE_OUT_DIR}/out_checkpoint.tar.zst"
              echo "Checkpoint saved. Re-run this workflow with resume_from_remote=true to finish."
            fi
            exit 1
          else
            echo "Build failed with exit code $BUILD_EXIT"
            exit "$BUILD_EXIT"
          fi

      - name: Upload Finished Artifacts to Remote Server
        if: success() && env.REMOTE_HOST != ''
        run: |
          set -e
          DEST="${REMOTE_USER}@${REMOTE_HOST}"
          RELEASE_DIR="${REMOTE_OUT_DIR}/releases/${{ inputs.device }}-$(date +%Y%m%d-%H%M)"
          PRODUCT_OUT="/home/runner/out/target/product/${{ inputs.device }}"

          ssh -p "$REMOTE_PORT" "$DEST" "mkdir -p ${RELEASE_DIR}"
          for f in "$PRODUCT_OUT"/lineage-*.zip "$PRODUCT_OUT"/*.img; do
            [ -f "$f" ] && scp -P "$REMOTE_PORT" "$f" "${DEST}:${RELEASE_DIR}/"
          done

      - name: Upload GitHub Release Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-20-${{ inputs.device }}
          if-no-files-found: warn
          path: |
            /home/runner/out/target/product/${{ inputs.device }}/lineage-*.zip
            /home/runner/out/target/product/${{ inputs.device }}/boot.img
            /home/runner/out/target/product/${{ inputs.device }}/system.img
            /home/runner/out/target/product/${{ inputs.device }}/vendor.img
            /home/runner/out/target/product/${{ inputs.device }}/recovery.img
