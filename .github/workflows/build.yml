name: Build LineageOS for TCL Tab 10L Gen 2

on:
  workflow_dispatch:
    inputs:
      lineage_branch:
        description: LineageOS branch to sync
        required: true
        default: lineage-20.0
        type: string
      jobs:
        description: Number of parallel build jobs
        required: true
        default: "4"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build LineageOS
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          path: device-tree
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 \
            openjdk-17-jdk

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize LineageOS source tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"
          repo init -u https://github.com/LineageOS/android.git -b "${{ inputs.lineage_branch }}" --git-lfs

      - name: Sync LineageOS source
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/android"
          repo sync -c --force-sync --no-clone-bundle -j"${{ inputs.jobs }}"

      - name: Copy device tree into source tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/android/device/tcl/8492A"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$GITHUB_WORKSPACE/device-tree/" \
            "$GITHUB_WORKSPACE/android/device/tcl/8492A/"

      - name: Prepare environment
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch lineage_8492A-userdebug

      - name: Build LineageOS
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch lineage_8492A-userdebug
          mka bacon -j"${{ inputs.jobs }}"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-8492A-${{ inputs.lineage_branch }}
          path: |
            ${{ github.workspace }}/android/out/target/product/8492A/*.zip
            ${{ github.workspace }}/android/out/target/product/8492A/*.img
          if-no-files-found: error
          retention-days: 7