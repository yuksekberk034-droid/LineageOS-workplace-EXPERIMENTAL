name: Build LineageOS for TCL 8492A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Swap Space (12GB on /mnt)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          swapon --show
          free -h
          df -h / /mnt

      - name: Install Build Dependencies & SSHFS
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 sshfs

          git config --global user.name "GitHub Action Builder"
          git config --global user.email "actions@github.com"

          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Inject Legacy libncurses5 for Ubuntu 24.04
        run: |
          cd /tmp
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb
          sudo dpkg -i libtinfo5_6.3-2_amd64.deb libncurses5_6.3-2_amd64.deb

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --accept-routes

      - name: Write SSH Private Key
        env:
          REMOTE_SSH_KEY: ${{ secrets.REMOTE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh workspace
          python3 - << 'EOF'
          import base64, os, re

          raw = os.environ.get("REMOTE_SSH_KEY", "").strip()
          if not raw:
              raise SystemExit("ERROR: REMOTE_SSH_KEY secret is empty")

          if "BEGIN OPENSSH PRIVATE KEY" in raw:
              body = re.sub(r"-----BEGIN OPENSSH PRIVATE KEY-----|-----END OPENSSH PRIVATE KEY-----", "", raw)
              b64_clean = "".join(body.split())
              lines = [b64_clean[i:i+70] for i in range(0, len(b64_clean), 70)]
              data = ("-----BEGIN OPENSSH PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END OPENSSH PRIVATE KEY-----\n").encode("utf-8")
          else:
              b64_clean = "".join(raw.split())
              b64_clean += "=" * ((4 - len(b64_clean) % 4) % 4)
              data = base64.b64decode(b64_clean)

          key_path = os.path.expanduser("~/.ssh/id_ed25519")
          with open(key_path, "wb") as f:
              f.write(data)
          os.chmod(key_path, 0o600)
          print(f"Wrote {len(data)} bytes to {key_path}")
          EOF
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null

      - name: Mount Local 110GB Drive for Heavy Artifacts
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        run: |
          R_USER=$(printf '%s' "$REMOTE_USER" | tr -d '[:space:]')
          R_HOST=$(printf '%s' "$REMOTE_HOST" | tr -d '[:space:]')
          REMOTE_PATH="/run/media/berk/8cef65af-f6fa-4041-8d9a-982f64a26440/lineage_out"

          sudo mkdir -p /mnt/remote_out
          sudo chown -R "$USER:$USER" /mnt/remote_out

          echo "=== Warming up Tailscale tunnel to $R_HOST ==="
          tailscale status
          tailscale ping --until-direct=false --timeout=30s --c=3 "$R_HOST" || true

          echo "=== Ensuring Remote Directory Exists ==="
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            "${R_USER}@${R_HOST}" "mkdir -p '$REMOTE_PATH'"

          sshfs "${R_USER}@${R_HOST}:${REMOTE_PATH}" \
            /mnt/remote_out \
            -o IdentityFile="$HOME/.ssh/id_ed25519" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o max_conns=6 \
            -o TCPKeepAlive=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            -o ConnectTimeout=30 \
            -o reconnect \
            -o cache=yes \
            -o kernel_cache \
            -o auto_cache \
            -o entry_timeout=300 \
            -o attr_timeout=300 \
            -o ac_attr_timeout=300 \
            -o negative_timeout=300 \
            -o compression=yes \
            -o Ciphers=aes128-gcm@openssh.com

          echo "=== Mounted Remote Storage ==="
          df -h /mnt/remote_out

      - name: Initialize LineageOS Workspace
        run: |
          cd workspace
          ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --depth=1 --no-clone-bundle
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/.github/manifests/8492A.xml .repo/local_manifests/

      - name: Sync Source Code
        run: |
          cd workspace
          ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Compile LineageOS
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        run: |
          cd workspace
          export R_USER=$(printf '%s' "$REMOTE_USER" | tr -d '[:space:]')
          export R_HOST=$(printf '%s' "$REMOTE_HOST" | tr -d '[:space:]')
          export REMOTE_PATH="/run/media/berk/8cef65af-f6fa-4041-8d9a-982f64a26440/lineage_out"

          MNT_AVAIL_GB=$(df -BG /mnt | awk 'NR==2 {gsub("G",""); print $4}')
          if [ "${MNT_AVAIL_GB:-0}" -ge 8 ]; then
            export TMPDIR="/mnt/tmp"
          else
            export TMPDIR="/tmp/lineage_tmp"
          fi
          sudo mkdir -p "$TMPDIR" && sudo chown -R "$USER:$USER" "$TMPDIR"
          echo "Using TMPDIR=$TMPDIR (free space: $(df -h "$TMPDIR" | awk 'NR==2 {print $4}'))"

          export USE_CCACHE=0
          export WITH_DEXPREOPT=false
          export DONT_DEXPREOPT_PREBUILTS=true
          export _JAVA_OPTIONS="-Xmx6g"

          echo "=== Running envsetup and lunch on local NVMe ==="
          source build/envsetup.sh
          lunch lineage_8492A-userdebug

          # Only remove .repo so all prebuilt and CTS Android.bp source paths stay intact
          rm -rf .repo
          mkdir -p .repo/repo
          printf '#!/usr/bin/env python3\nimport sys\nprint("<?xml version=\\"1.0\\" encoding=\\"UTF-8\\"?>\\n<manifest></manifest>")\n' > .repo/repo/repo
          chmod +x .repo/repo/repo

          echo "=== Generating Ninja build graph on local NVMe ==="
          mka nothing -j$(nproc --all)

          # Restore Ninja build logs and link all cached artifacts in seconds via SSH
          mkdir -p /mnt/remote_out/offload/out /mnt/remote_out/ninja_state /mnt/remote_out/FINAL_ROM
          cp -f /mnt/remote_out/ninja_state/.ninja_log out/.ninja_log 2>/dev/null || true
          cp -f /mnt/remote_out/ninja_state/.ninja_deps out/.ninja_deps 2>/dev/null || true

          echo "=== Linking previously offloaded artifacts from 110GB drive ==="
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            "${R_USER}@${R_HOST}" \
            "mkdir -p '${REMOTE_PATH}/offload' && cd '${REMOTE_PATH}/offload' && find out -type f ! -name '*.tmp' 2>/dev/null || true" \
            | python3 - << 'EOF'
          import os, sys

          linked = 0
          for line in sys.stdin:
              rel_path = line.strip()
              if not rel_path:
                  continue
              remote_file = os.path.join("/mnt/remote_out/offload", rel_path)
              if not os.path.lexists(rel_path):
                  os.makedirs(os.path.dirname(rel_path), exist_ok=True)
                  os.symlink(remote_file, rel_path)
                  linked += 1
          print(f"Linked {linked} cached artifacts from external drive")
          EOF

          offload_completed_artifacts() {
            python3 - << 'EOF'
          import os, subprocess, time

          now = time.time()
          scan_roots = ["out/soong/.intermediates", "out/target"]
          candidates = []
          total_bytes = 0

          for base in scan_roots:
              if not os.path.exists(base):
                  continue
              for root, _, files in os.walk(base):
                  for fname in files:
                      src = os.path.join(root, fname)
                      try:
                          if os.path.islink(src):
                              continue
                          st = os.stat(src)
                          # Only offload files > 128KB untouched for at least 45 seconds
                          if st.st_size < 131072 or (now - st.st_mtime) < 45:
                              continue
                          candidates.append((src, st.st_size))
                          total_bytes += st.st_size
                      except OSError:
                          pass

          if not candidates:
              print("=== No new completed files >= 128KB to offload ===")
              raise SystemExit(0)

          list_path = "/tmp/offload_list.txt"
          with open(list_path, "w") as f:
              for src, _ in candidates:
                  f.write(src + "\n")

          r_user = os.environ["R_USER"]
          r_host = os.environ["R_HOST"]
          remote_dir = os.environ["REMOTE_PATH"] + "/offload"

          # Stream all candidates in a single continuous SSH tar pipe at full line speed
          tar_cmd = ["tar", "-cf", "-", "-T", list_path]
          ssh_cmd = [
              "ssh", "-i", os.path.expanduser("~/.ssh/id_ed25519"),
              "-o", "StrictHostKeyChecking=no",
              "-o", "UserKnownHostsFile=/dev/null",
              "-o", "Compression=yes",
              "-c", "aes128-gcm@openssh.com",
              f"{r_user}@{r_host}",
              f"mkdir -p '{remote_dir}' && tar -xf - -C '{remote_dir}'"
          ]

          p1 = subprocess.Popen(tar_cmd, stdout=subprocess.PIPE)
          p2 = subprocess.Popen(ssh_cmd, stdin=p1.stdout)
          p1.stdout.close()
          if p2.wait() != 0 or p1.wait() != 0:
              print("=== Bulk tar offload encountered an error; will retry next cycle ===")
              raise SystemExit(0)

          # Replace streamed files with symlinks to /mnt/remote_out/offload
          replaced = 0
          for src, _ in candidates:
              dst = os.path.join("/mnt/remote_out/offload", src)
              try:
                  if os.path.exists(dst) and not os.path.islink(src):
                      tmp_link = src + ".symlink_tmp"
                      if os.path.lexists(tmp_link):
                          os.unlink(tmp_link)
                      os.symlink(dst, tmp_link)
                      os.replace(tmp_link, src)
                      replaced += 1
              except OSError:
                  pass

          print(f"=== Bulk-offloaded {replaced} files ({total_bytes / (1024**3):.2f} GB) at full line speed ===")
          EOF
            cp -f out/.ninja_log out/.ninja_deps /mnt/remote_out/ninja_state/ 2>/dev/null || true
          }

          echo "=== Space Before Build (Runner Root vs Mounted 110GB Drive) ==="
          df -h / /mnt/remote_out

          mka bacon -j6 > build.log 2>&1 &
          BUILD_PID=$!
          LAST_BUCKET=0

          while kill -0 $BUILD_PID 2>/dev/null; do
            sleep 60
            PROGRESS=$(tr '\r' '\n' < build.log | grep -E '^\[ *[0-9]+%' | tail -n 1)
            PCT=$(echo "$PROGRESS" | sed -n 's/^\[ *\([0-9]\+\)%.*/\1/p')
            PCT=${PCT:-0}
            BUCKET=$((PCT / 5))
            ROOT_FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G",""); print $4}')

            # Offload every 5% (5%, 10%, 15%...) OR whenever local NVMe drops below 15GB
            if [ "$BUCKET" -gt "$LAST_BUCKET" ] || [ "${ROOT_FREE_GB:-0}" -lt 15 ]; then
              echo "[$(date -u +%H:%M:%S)] Milestone ${PCT}% reached (Root free: ${ROOT_FREE_GB}G) — offloading completed artifacts..."
              offload_completed_artifacts
              LAST_BUCKET=$BUCKET
            fi

            ROOT_FREE=$(df -h / | awk 'NR==2 {print $4}')
            OUT_FREE=$(df -h /mnt/remote_out | awk 'NR==2 {print $4}')
            echo "[$(date -u +%H:%M:%S)] ${PROGRESS:-Starting...} | Root free: ${ROOT_FREE} | Remote /out free: ${OUT_FREE}"
          done

          wait $BUILD_PID
          BUILD_STATUS=$?

          offload_completed_artifacts

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=== BUILD FAILED — LAST 100 LINES OF build.log ==="
            tail -n 100 build.log
            exit 1
          fi

          echo "=== Copying Final Flashable ROM to Local Drive ==="
          cp -f out/target/product/Freyr_10_1_WiFi/lineage-*.zip /mnt/remote_out/FINAL_ROM/ 2>/dev/null || true
          cp -f out/target/product/Freyr_10_1_WiFi/*.img /mnt/remote_out/FINAL_ROM/ 2>/dev/null || true
          ls -lh /mnt/remote_out/FINAL_ROM/

      - name: Unmount Remote Drive
        if: always()
        run: |
          fusermount -u /mnt/remote_out || true
          
