name: Build LineageOS for TCL Tab 10L Gen 2

on:
  workflow_dispatch:
    inputs:
      lineage_branch:
        description: LineageOS branch to sync
        required: true
        default: lineage-20.0
        type: string
      jobs:
        description: Number of parallel build jobs
        required: true
        default: "4"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build LineageOS
    runs-on: ubuntu-latest
    # Maximum timeout for free runners is 360 mins (6 hours).
    # If the build takes longer, you will need to implement ccache saving.
    timeout-minutes: 360

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          path: device-tree
          fetch-depth: 1

      - name: Maximize Runner Space & Add Swap
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 12288 # Creates a 12GB Swap file to prevent OOM
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 \
            openjdk-17-jdk -y

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize LineageOS source tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"
          # OPTIMIZATION: --depth=1 saves ~30GB of disk space
          repo init -u https://github.com/LineageOS/android.git -b "${{ inputs.lineage_branch }}" --git-lfs --depth=1

      - name: Sync LineageOS source
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/android"
          # OPTIMIZATION: --no-tags and --optimized-fetch speed up sync
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j8

      - name: Copy device tree into source tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/android/device/tcl/8492A"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$GITHUB_WORKSPACE/device-tree/" \
            "$GITHUB_WORKSPACE/android/device/tcl/8492A/"

      - name: Prepare environment
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch lineage_8492A-userdebug

      - name: Build LineageOS
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch lineage_8492A-userdebug
          # Use the swap space we created earlier
          export _JAVA_OPTIONS="-Xmx8g"
          mka bacon -j"${{ inputs.jobs }}"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-8492A-${{ inputs.lineage_branch }}
          path: |
            ${{ github.workspace }}/android/out/target/product/8492A/*.zip
            ${{ github.workspace }}/android/out/target/product/8492A/*.img
          if-no-files-found: warn
          retention-days: 7
          
