name: Build LineageOS for TCL 8492A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          df -h /
          
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Allocate Swap Space
        run: |
          # Turn off existing swap to unlock /swapfile
          sudo swapoff -a || true
          sudo rm -f /swapfile

          # Allocate 10GB swap file (with dd fallback)
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          
          git config --global user.name "GitHub Action Builder"
          git config --global user.email "actions@github.com"
          
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Initialize LineageOS Workspace
        run: |
          mkdir workspace
          cd workspace
          ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --depth=1
          
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/.github/manifests/8492A.xml .repo/local_manifests/

      - name: Sync Source Code (Shallow)
        run: |
          cd workspace
          ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Compile LineageOS
        run: |
          cd workspace
          mkdir -p tmp
          export TMPDIR="$PWD/tmp"
          export USE_CCACHE=0
          export _JAVA_OPTIONS="-Xmx4g"
          df -h /
          
          source build/envsetup.sh
          lunch lineage_8492A-userdebug
          mka bacon -j2

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-8492A-Build
          path: workspace/out/target/product/8492A/lineage-*.zip
