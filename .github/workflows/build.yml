name: Build LineageOS for TCL 8492A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "Disk after cleanup:"
          df -h

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Diagnose root disk usage
        run: |
          df -h /
          sudo du -xhd1 / 2>/dev/null | sort -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::Languages=none update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential curl flex g++-multilib gcc-multilib git git-lfs \
            gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python-is-python3

          git config --global user.name "GitHub Action Builder"
          git config --global user.email "actions@github.com"

          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Initialize LineageOS Workspace
        run: |
          mkdir workspace
          cd workspace
          ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --depth=1
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/.github/manifests/8492A.xml .repo/local_manifests/

      - name: Sync Source Code
        run: |
          cd workspace
          ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Compile LineageOS
        run: |
          cd workspace
          export TMPDIR="$PWD/tmp"
          mkdir -p "$TMPDIR"
          export USE_CCACHE=0
          export _JAVA_OPTIONS="-Xmx4g"

          source build/envsetup.sh
          lunch lineage_8492A-userdebug
          mka bacon -j2

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-8492A-Build
          path: workspace/out/target/product/8492A/lineage-*.zip
